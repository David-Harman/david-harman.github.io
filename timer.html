<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Timer</title>
  <style>
    :root {
      --bg: #07111f;
      --panel: #0d1b2e;
      --panel-2: #13253d;
      --text: #f7fbff;
      --muted: #a9bdd1;
      --accent: #49d6c8;
      --accent-dark: #052d2b;
      --warning: #ffcf5c;
      --danger: #ff6b78;
      --border: rgba(255, 255, 255, .14);
      --shadow: 0 24px 70px rgba(0, 0, 0, .35);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% -20%, rgba(48, 107, 157, .28), transparent 48%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-variant-numeric: tabular-nums;
    }

    button, input, select { font: inherit; }

    button {
      border: 1px solid var(--border);
      border-radius: .8rem;
      background: var(--panel-2);
      color: var(--text);
      cursor: pointer;
      font-weight: 700;
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
    }

    button:hover { background: #1a3251; border-color: rgba(255,255,255,.3); }
    button:active { transform: translateY(1px); }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--warning); outline-offset: 3px; }

    .app {
      min-height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(1rem, 2.4vw, 2.5rem);
      gap: clamp(.8rem, 2vh, 1.6rem);
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: start;
      gap: 1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: clamp(.8rem, 1.8vh, 1.4rem);
    }

    h1 {
      margin: 0;
      max-width: 80vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: clamp(2rem, 5vw, 5.6rem);
      line-height: 1.05;
      letter-spacing: -.04em;
    }
    .header-actions { display: flex; align-items: center; gap: .6rem; }
    .icon-button { padding: .75rem 1rem; font-size: clamp(.82rem, 1vw, 1rem); }
    .main-seconds-toggle { display: flex; align-items: center; gap: .55rem; padding: .7rem .85rem; border: 1px solid var(--border); border-radius: .8rem; background: var(--panel-2); font-size: clamp(.82rem, 1vw, 1rem); font-weight: 700; cursor: pointer; }
    .main-seconds-toggle input { width: 1.15rem; height: 1.15rem; margin: 0; accent-color: var(--accent); cursor: pointer; }

    main {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) minmax(18rem, .8fr);
      gap: clamp(.8rem, 2vw, 1.5rem);
    }

    .card {
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: clamp(1rem, 2vw, 1.6rem);
      background: linear-gradient(145deg, rgba(19, 37, 61, .95), rgba(10, 25, 43, .95));
      box-shadow: var(--shadow);
    }

    .remaining-card {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(1.4rem, 4vw, 4rem);
      position: relative;
      overflow: hidden;
    }

    .remaining-card::after {
      content: "";
      position: absolute;
      inset: auto -8% -35% auto;
      width: 45vmin;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(73, 214, 200, .055);
      pointer-events: none;
    }

    .label {
      color: var(--muted);
      font-size: clamp(.95rem, 1.6vw, 1.5rem);
      font-weight: 750;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .remaining {
      margin: .4rem 0;
      color: var(--accent);
      font-size: clamp(4.5rem, 13vw, 13rem);
      font-weight: 800;
      line-height: .95;
      letter-spacing: -.065em;
      white-space: nowrap;
    }

    .status {
      color: var(--muted);
      font-size: clamp(1rem, 1.8vw, 1.65rem);
      font-weight: 600;
    }

    .details {
      display: grid;
      align-content: center;
      padding: clamp(1.2rem, 2.5vw, 2.5rem);
    }

    .detail-row { padding: clamp(.7rem, 1.5vh, 1.15rem) 1rem; border-bottom: 1px solid var(--border); }
    .detail-row:last-child { border-bottom: 0; }
    .detail-value { display: block; margin-top: .22rem; font-size: clamp(1.75rem, 3.5vw, 3.8rem); font-weight: 760; line-height: 1.05; }
    .timer-detail { transition: background .2s ease, box-shadow .2s ease; }
    .timer-detail.active { background: rgba(73, 214, 200, .1); box-shadow: inset .35rem 0 0 var(--accent); }
    .timer-detail.active .label { color: var(--accent); }
    .schedule { display: none; }
    body.running .schedule, body.finished .schedule { display: block; }
    [hidden] { display: none !important; }
    footer { display: grid; justify-items: center; gap: .55rem; }
    .footer-controls { display: flex; justify-content: center; gap: .8rem; }
    .footer-controls button { min-width: 11rem; min-height: 3.4rem; }
    .staff-schedule { display: flex; flex-wrap: nowrap; justify-content: center; gap: .35rem 1.2rem; min-height: 1.2em; visibility: hidden; color: var(--muted); font-size: clamp(.72rem, .9vw, .9rem); }
    .staff-schedule span { white-space: nowrap; }
    body.running .staff-schedule, body.finished .staff-schedule { visibility: visible; }
    .staff-schedule strong { color: var(--text); }
    .primary { min-width: 11rem; padding: .85rem 2rem; border-color: transparent; background: var(--accent); color: var(--accent-dark); font-size: clamp(1rem, 1.4vw, 1.3rem); }
    .primary:hover { background: #70e7dc; }
    .secondary { padding: .85rem 1.5rem; font-size: clamp(1rem, 1.3vw, 1.2rem); }
    #resetButton { display: none; }
    body.running #startButton, body.finished #startButton { display: none; }
    body.running #resetButton, body.finished #resetButton { display: inline-block; }
    body.finishing .remaining { color: var(--warning); }
    body.finished .remaining { color: var(--danger); }

    dialog {
      width: min(74rem, calc(100% - 2rem));
      max-height: calc(100% - 2rem);
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 1.2rem;
      background: var(--panel);
      color: var(--text);
      box-shadow: var(--shadow);
    }

    dialog::backdrop { background: rgba(1, 7, 14, .78); backdrop-filter: blur(5px); }
    .dialog-content { padding: clamp(1.3rem, 4vw, 2.2rem); }
    .dialog-content h2 { margin: 0 0 .3rem; font-size: 1.7rem; }
    .dialog-content > p { margin: 0 0 1.5rem; color: var(--muted); }
    .timer-name-field { max-width: 32rem; }
    .timer-config-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
    .timer-config { min-width: 0; padding: 1rem; border: 1px solid var(--border); border-radius: 1rem; background: #0a192a; }
    .timer-config.dragging { opacity: .4; border-color: var(--accent); }
    .timer-config-header { display: flex; align-items: center; gap: .55rem; color: var(--muted); }
    .drag-handle { color: var(--accent); font-size: 1.6rem; line-height: 1; cursor: grab; user-select: none; }
    .move-buttons { display: flex; gap: .3rem; margin-left: auto; }
    .move-buttons button { width: 2rem; height: 2rem; padding: 0; }
    .field { display: grid; gap: .45rem; margin: 1rem 0; font-weight: 700; }
    input, select { width: 100%; border: 1px solid var(--border); border-radius: .7rem; background: #071524; color: var(--text); padding: .8rem .9rem; font-size: 1.05rem; }
    .duration-fields { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
    .toggle-field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin: 1.15rem 0 .4rem;
      padding: .9rem 1rem;
      border: 1px solid var(--border);
      border-radius: .8rem;
      background: #071524;
      font-weight: 700;
      cursor: pointer;
    }
    .toggle-field input { width: 1.35rem; height: 1.35rem; margin: 0; accent-color: var(--accent); cursor: pointer; }
    .error { min-height: 1.4em; margin: .6rem 0 0; color: var(--danger); font-weight: 650; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: .7rem; margin-top: 1.2rem; }
    .dialog-actions button { padding: .7rem 1.2rem; }

    @media (max-width: 800px) {
      .app { overflow: auto; }
      body { overflow: auto; }
      main { grid-template-columns: 1fr; }
      .remaining-card { min-height: 42vh; }
      .details { grid-template-columns: repeat(2, 1fr); gap: 0 1rem; }
      .detail-row:nth-last-child(-n+2) { border-bottom: 0; }
      .remaining { font-size: clamp(4rem, 20vw, 8rem); }
      .button-text { display: none; }
      .timer-config-list { grid-template-columns: 1fr; }
      dialog { max-height: calc(100% - 1rem); }
      .staff-schedule { flex-wrap: wrap; min-height: 2.5em; }
    }

    @media (max-height: 650px) and (min-width: 801px) {
      .app { padding-block: .8rem; gap: .65rem; }
      .remaining { font-size: clamp(4rem, 12vw, 8rem); }
      .detail-row { padding: .55rem 1rem; }
      footer button { padding-block: .6rem !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1 id="timerName">Timer</h1>
      </div>
      <div class="header-actions">
        <label class="main-seconds-toggle"><input id="showSecondsMain" type="checkbox" checked aria-label="Show seconds"> <span class="button-text">Show seconds</span></label>
        <button class="icon-button" id="fullscreenButton" type="button" aria-label="Enter fullscreen">⛶ <span class="button-text">Fullscreen</span></button>
        <button class="icon-button" id="settingsButton" type="button">⚙ <span class="button-text">Settings</span></button>
      </div>
    </header>

    <main>
      <section class="card remaining-card" aria-live="polite">
        <span class="label" id="remainingLabel">Writing time remaining</span>
        <div class="remaining" id="remainingTime">02:00:00</div>
        <div class="status" id="statusText">Ready to begin</div>
      </section>

      <section class="card details" id="timerDetails" aria-label="Timer details">
        <div class="detail-row current-detail"><span class="label">Current time</span><time class="detail-value" id="currentTime">—</time></div>
        <div class="detail-row timer-detail" id="timerDetail1"><span class="label">Writing time ends</span><time class="detail-value">—</time></div>
        <div class="detail-row timer-detail" id="timerDetail2" hidden><span class="label">Timer 2</span><span class="detail-value">—</span></div>
        <div class="detail-row timer-detail" id="timerDetail3" hidden><span class="label">Timer 3</span><span class="detail-value">—</span></div>
      </section>
    </main>

    <footer>
      <div class="footer-controls">
        <button class="primary" id="startButton" type="button">Start timer</button>
        <button class="secondary" id="resetButton" type="button">Reset timer</button>
      </div>
      <div class="staff-schedule" id="staffSchedule" aria-label="Staff timer schedule">
        <span id="scheduleDetail1"><strong>Writing time:</strong> <time>—</time></span>
        <span id="scheduleDetail2" hidden><strong>Timer 2:</strong> <time>—</time></span>
        <span id="scheduleDetail3" hidden><strong>Timer 3:</strong> <time>—</time></span>
      </div>
    </footer>
  </div>

  <dialog id="settingsDialog" aria-labelledby="settingsTitle">
    <form class="dialog-content" id="settingsForm" method="dialog">
      <h2 id="settingsTitle">Timer settings</h2>
      <p>Drag the timer cards into the order in which they should run.</p>
      <label class="field timer-name-field">
        Timer name
        <input id="nameInput" name="timerName" type="text" maxlength="80" value="Timer" required autocomplete="off">
      </label>
      <div class="timer-config-list" id="timerConfigList">
        <section class="timer-config" draggable="true" data-timer-id="1">
          <div class="timer-config-header"><span class="drag-handle" title="Drag to reorder">⠿</span><strong>Timer</strong><span class="move-buttons"><button type="button" data-move="-1" aria-label="Move timer earlier">←</button><button type="button" data-move="1" aria-label="Move timer later">→</button></span></div>
          <label class="field">Name<input class="phase-name" type="text" maxlength="40" value="Writing time" autocomplete="off"></label>
          <div class="duration-fields"><label class="field">Hours<input class="phase-hours" type="number" min="0" max="24" step="1" value="2" inputmode="numeric"></label><label class="field">Minutes<input class="phase-minutes" type="number" min="0" max="59" step="1" value="0" inputmode="numeric"></label></div>
        </section>
        <section class="timer-config" draggable="true" data-timer-id="2">
          <div class="timer-config-header"><span class="drag-handle" title="Drag to reorder">⠿</span><strong>Timer</strong><span class="move-buttons"><button type="button" data-move="-1" aria-label="Move timer earlier">←</button><button type="button" data-move="1" aria-label="Move timer later">→</button></span></div>
          <label class="field">Name<input class="phase-name" type="text" maxlength="40" autocomplete="off" placeholder="Optional"></label>
          <div class="duration-fields"><label class="field">Hours<input class="phase-hours" type="number" min="0" max="24" step="1" value="0" inputmode="numeric"></label><label class="field">Minutes<input class="phase-minutes" type="number" min="0" max="59" step="1" value="0" inputmode="numeric"></label></div>
        </section>
        <section class="timer-config" draggable="true" data-timer-id="3">
          <div class="timer-config-header"><span class="drag-handle" title="Drag to reorder">⠿</span><strong>Timer</strong><span class="move-buttons"><button type="button" data-move="-1" aria-label="Move timer earlier">←</button><button type="button" data-move="1" aria-label="Move timer later">→</button></span></div>
          <label class="field">Name<input class="phase-name" type="text" maxlength="40" autocomplete="off" placeholder="Optional"></label>
          <div class="duration-fields"><label class="field">Hours<input class="phase-hours" type="number" min="0" max="24" step="1" value="0" inputmode="numeric"></label><label class="field">Minutes<input class="phase-minutes" type="number" min="0" max="59" step="1" value="0" inputmode="numeric"></label></div>
        </section>
      </div>
      <label class="toggle-field">
        Show seconds
        <input id="showSecondsInput" name="showSeconds" type="checkbox" checked>
      </label>
      <p class="error" id="settingsError" role="alert"></p>
      <div class="dialog-actions">
        <button id="cancelSettings" type="button">Cancel</button>
        <button class="primary" type="submit">Save settings</button>
      </div>
    </form>
  </dialog>

  <script type="text/plain" id="legacyScript">
    (() => {
      const $ = (id) => document.getElementById(id);
      const elements = {
        timerName: $('timerName'), remainingTime: $('remainingTime'), remainingLabel: $('remainingLabel'),
        totalTime: $('totalTime'), timeTypeLabel: $('timeTypeLabel'), timerDetails: $('timerDetails'),
        mainScheduleDetail: $('mainScheduleDetail'), timeStartsLabel: $('timeStartsLabel'), currentTime: $('currentTime'),
        startTime: $('startTime'), statusText: $('statusText'), optional1Detail: $('optional1Detail'),
        optional1Label: $('optional1Label'), optional1Time: $('optional1Time'), optional1EndDetail: $('optional1EndDetail'),
        optional1EndsLabel: $('optional1EndsLabel'), optional1EndTime: $('optional1EndTime'), optional2Detail: $('optional2Detail'),
        optional2Label: $('optional2Label'), optional2Time: $('optional2Time'), optional2EndDetail: $('optional2EndDetail'),
        optional2EndsLabel: $('optional2EndsLabel'), optional2EndTime: $('optional2EndTime'),
        startButton: $('startButton'), resetButton: $('resetButton'), settingsButton: $('settingsButton'),
        fullscreenButton: $('fullscreenButton'), dialog: $('settingsDialog'), form: $('settingsForm'),
        nameInput: $('nameInput'), timeTypeInput: $('timeTypeInput'), hoursInput: $('hoursInput'), minutesInput: $('minutesInput'),
        optional1NameInput: $('optional1NameInput'), optional1PositionInput: $('optional1PositionInput'),
        optional1HoursInput: $('optional1HoursInput'), optional1MinutesInput: $('optional1MinutesInput'),
        optional2NameInput: $('optional2NameInput'), optional2PositionInput: $('optional2PositionInput'),
        optional2HoursInput: $('optional2HoursInput'), optional2MinutesInput: $('optional2MinutesInput'),
        showSecondsInput: $('showSecondsInput'),
        error: $('settingsError'), cancelSettings: $('cancelSettings')
      };

      let durationMs = 2 * 60 * 60 * 1000;
      let timeType = 'Writing time';
      let optionalTimers = [];
      let showSeconds = true;
      let startAt = null;
      let endAt = null;
      let phases = [];
      let timerId = null;
      let wakeLock = null;

      const two = (value) => String(value).padStart(2, '0');
      const formatClock = (date) => date.toLocaleTimeString([], {
        hour: '2-digit', minute: '2-digit', ...(showSeconds ? { second: '2-digit' } : {})
      });
      const formatCountdown = (ms) => {
        if (!showSeconds) {
          const totalMinutes = Math.max(0, Math.ceil(ms / 60000));
          return `${two(Math.floor(totalMinutes / 60))}:${two(totalMinutes % 60)}`;
        }
        const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        return `${two(hours)}:${two(minutes)}:${two(totalSeconds % 60)}`;
      };
      const formatDuration = (ms) => {
        const totalMinutes = Math.round(ms / 60000);
        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;
        const parts = [];
        if (hours) parts.push(`${hours} ${hours === 1 ? 'hour' : 'hours'}`);
        if (minutes) parts.push(`${minutes} ${minutes === 1 ? 'minute' : 'minutes'}`);
        return parts.join(' ');
      };

      function updateCurrentTime() {
        const now = new Date();
        elements.currentTime.textContent = formatClock(now);
        elements.currentTime.dateTime = now.toISOString();
      }

      function updateCountdown() {
        updateCurrentTime();
        if (!endAt) return;
        const now = Date.now();
        const phase = phases.find((item) => now < item.end.getTime());
        if (!phase) {
          clearInterval(timerId);
          timerId = null;
          elements.remainingTime.textContent = formatCountdown(0);
          document.body.classList.remove('running', 'finishing');
          document.body.classList.add('finished');
          elements.statusText.textContent = 'Timer complete';
          document.title = `Time is up — ${elements.timerName.textContent}`;
          releaseWakeLock();
          return;
        }
        const remaining = phase.end.getTime() - now;
        elements.remainingLabel.textContent = `${phase.name} remaining`;
        elements.statusText.textContent = `${phase.name} underway`;
        elements.remainingTime.textContent = formatCountdown(remaining);
        document.body.classList.toggle('finishing', remaining > 0 && remaining <= 10 * 60 * 1000);
      }

      async function requestWakeLock() {
        try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (_) {}
      }

      async function releaseWakeLock() {
        try { if (wakeLock) await wakeLock.release(); } catch (_) {}
        wakeLock = null;
      }

      function startTimer() {
        startAt = new Date();
        let cursor = startAt;
        const beforeMain = optionalTimers.filter((item) => item.position === 'before');
        const afterMain = optionalTimers.filter((item) => item.position === 'after');
        const orderedTimers = [...beforeMain, { name: timeType, durationMs, number: 0 }, ...afterMain];
        phases = orderedTimers.map((item) => {
          const phase = { ...item, start: cursor, end: new Date(cursor.getTime() + item.durationMs) };
          cursor = phase.end;
          return phase;
        });
        endAt = phases.at(-1).end;
        phases.forEach((phase) => {
          const row = phase.number === 0 ? elements.mainScheduleDetail : elements[`optional${phase.number}EndDetail`];
          const label = phase.number === 0 ? elements.timeStartsLabel : elements[`optional${phase.number}EndsLabel`];
          const value = phase.number === 0 ? elements.startTime : elements[`optional${phase.number}EndTime`];
          label.textContent = `${phase.name} schedule`;
          value.textContent = `${formatClock(phase.start)} – ${formatClock(phase.end)}`;
          value.dateTime = phase.start.toISOString();
          elements.timerDetails.appendChild(row);
        });
        elements.settingsButton.disabled = true;
        document.body.className = 'running';
        document.title = `${elements.timerName.textContent} — Timer`;
        updateCountdown();
        timerId = setInterval(updateCountdown, 250);
        requestWakeLock();
      }

      function resetTimer() {
        if (!confirm('Reset the timer and return to the ready screen?')) return;
        clearInterval(timerId);
        timerId = null;
        startAt = null;
        endAt = null;
        phases = [];
        document.body.className = '';
        const firstTimer = optionalTimers.find((item) => item.position === 'before') || { name: timeType, durationMs };
        elements.remainingTime.textContent = formatCountdown(firstTimer.durationMs);
        elements.remainingLabel.textContent = `${firstTimer.name} remaining`;
        elements.startTime.textContent = '—';
        elements.optional1EndTime.textContent = '—';
        elements.optional2EndTime.textContent = '—';
        elements.statusText.textContent = 'Ready to begin';
        elements.settingsButton.disabled = false;
        document.title = 'Timer';
        releaseWakeLock();
      }

      function openSettings() {
        elements.error.textContent = '';
        elements.dialog.showModal();
        requestAnimationFrame(() => elements.nameInput.select());
      }

      function saveSettings(event) {
        event.preventDefault();
        const name = elements.nameInput.value.trim();
        const requestedTimeType = elements.timeTypeInput.value.trim();
        const hours = Number(elements.hoursInput.value || 0);
        const minutes = Number(elements.minutesInput.value || 0);
        const optionalInputs = [
          { number: 1, name: elements.optional1NameInput.value.trim(), position: elements.optional1PositionInput.value,
            hours: Number(elements.optional1HoursInput.value || 0), minutes: Number(elements.optional1MinutesInput.value || 0) },
          { number: 2, name: elements.optional2NameInput.value.trim(), position: elements.optional2PositionInput.value,
            hours: Number(elements.optional2HoursInput.value || 0), minutes: Number(elements.optional2MinutesInput.value || 0) }
        ];
        if (!name) { elements.error.textContent = 'Enter a timer name.'; return; }
        if (!requestedTimeType) { elements.error.textContent = 'Enter a type of main time.'; return; }
        if (!Number.isInteger(hours) || hours < 0 || hours > 24 || !Number.isInteger(minutes) || minutes < 0 || minutes > 59) {
          elements.error.textContent = 'Enter whole hours (0–24) and minutes (0–59).'; return;
        }
        if (optionalInputs.some((item) => !Number.isInteger(item.hours) || item.hours < 0 || item.hours > 24 ||
          !Number.isInteger(item.minutes) || item.minutes < 0 || item.minutes > 59)) {
          elements.error.textContent = 'Optional timers require whole hours (0–24) and minutes (0–59).'; return;
        }
        if (optionalInputs.some((item) => (item.name && !item.hours && !item.minutes) || (!item.name && (item.hours || item.minutes)))) {
          elements.error.textContent = 'Give each optional timer both a name and a duration, or leave both blank.'; return;
        }
        if (hours === 0 && minutes === 0) { elements.error.textContent = 'The duration must be at least one minute.'; return; }
        durationMs = (hours * 60 + minutes) * 60000;
        optionalTimers = optionalInputs.filter((item) => item.name && (item.hours || item.minutes)).map((item) => ({
          number: item.number, name: item.name, position: item.position,
          durationMs: (item.hours * 60 + item.minutes) * 60000
        }));
        timeType = requestedTimeType;
        showSeconds = elements.showSecondsInput.checked;
        elements.timerName.textContent = name;
        elements.timeTypeLabel.textContent = timeType;
        elements.timeStartsLabel.textContent = `${timeType} schedule`;
        elements.totalTime.textContent = formatDuration(durationMs);
        [0, 1].forEach((index) => {
          const number = index + 1;
          const timer = optionalTimers.find((item) => item.number === number);
          elements[`optional${number}Detail`].hidden = !timer;
          elements[`optional${number}EndDetail`].hidden = !timer;
          if (timer) {
            elements[`optional${number}Label`].textContent = timer.name;
            elements[`optional${number}Time`].textContent = formatDuration(timer.durationMs);
            elements[`optional${number}EndsLabel`].textContent = `${timer.name} schedule`;
          }
        });
        const firstTimer = optionalTimers.find((item) => item.position === 'before') || { name: timeType, durationMs };
        elements.remainingTime.textContent = formatCountdown(firstTimer.durationMs);
        elements.remainingLabel.textContent = `${firstTimer.name} remaining`;
        document.body.className = '';
        updateCurrentTime();
        elements.dialog.close();
      }

      async function toggleFullscreen() {
        try {
          if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
          else await document.exitFullscreen();
        } catch (_) {}
      }

      elements.startButton.addEventListener('click', startTimer);
      elements.resetButton.addEventListener('click', resetTimer);
      elements.settingsButton.addEventListener('click', openSettings);
      elements.cancelSettings.addEventListener('click', () => elements.dialog.close());
      elements.form.addEventListener('submit', saveSettings);
      elements.fullscreenButton.addEventListener('click', toggleFullscreen);
      document.addEventListener('fullscreenchange', () => {
        const active = Boolean(document.fullscreenElement);
        elements.fullscreenButton.innerHTML = `${active ? '✕' : '⛶'} <span class="button-text">${active ? 'Exit fullscreen' : 'Fullscreen'}</span>`;
        elements.fullscreenButton.setAttribute('aria-label', active ? 'Exit fullscreen' : 'Enter fullscreen');
      });
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && endAt) requestWakeLock(); });
      document.addEventListener('keydown', (event) => {
        if (event.key.toLowerCase() === 'f' && !elements.dialog.open) toggleFullscreen();
      });

      updateCurrentTime();
      setInterval(updateCurrentTime, 1000);
    })();
  </script>
  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const elements = {
        timerName: $('timerName'), remainingTime: $('remainingTime'), remainingLabel: $('remainingLabel'),
        statusText: $('statusText'), currentTime: $('currentTime'), settingsButton: $('settingsButton'),
        startButton: $('startButton'), resetButton: $('resetButton'), fullscreenButton: $('fullscreenButton'),
        dialog: $('settingsDialog'), form: $('settingsForm'), nameInput: $('nameInput'),
        showSecondsInput: $('showSecondsInput'), showSecondsMain: $('showSecondsMain'),
        error: $('settingsError'), cancelSettings: $('cancelSettings'), configList: $('timerConfigList')
      };

      let timers = [{ name: 'Writing time', durationMs: 2 * 60 * 60 * 1000 }];
      let phases = [];
      let endAt = null;
      let timerId = null;
      let wakeLock = null;
      let showSeconds = true;
      let draggedCard = null;

      const two = (value) => String(value).padStart(2, '0');
      const formatClock = (date) => date.toLocaleTimeString([], {
        hour: '2-digit', minute: '2-digit', ...(showSeconds ? { second: '2-digit' } : {})
      });
      const formatCountdown = (ms) => {
        if (!showSeconds) {
          const minutes = Math.max(0, Math.ceil(ms / 60000));
          return `${two(Math.floor(minutes / 60))}:${two(minutes % 60)}`;
        }
        const seconds = Math.max(0, Math.ceil(ms / 1000));
        return `${two(Math.floor(seconds / 3600))}:${two(Math.floor((seconds % 3600) / 60))}:${two(seconds % 60)}`;
      };
      const formatDuration = (ms) => {
        const minutes = Math.round(ms / 60000);
        const hours = Math.floor(minutes / 60);
        const remainder = minutes % 60;
        return [hours && `${hours} ${hours === 1 ? 'hour' : 'hours'}`, remainder && `${remainder} ${remainder === 1 ? 'minute' : 'minutes'}`].filter(Boolean).join(' ');
      };

      function updateCurrentTime() {
        const now = new Date();
        elements.currentTime.textContent = formatClock(now);
        elements.currentTime.dateTime = now.toISOString();
      }

      function renderTimers() {
        for (let index = 0; index < 3; index += 1) {
          const timer = timers[index];
          const detail = $(`timerDetail${index + 1}`);
          const schedule = $(`scheduleDetail${index + 1}`);
          detail.hidden = !timer;
          schedule.hidden = !timer;
          if (timer) {
            detail.querySelector('.label').textContent = `${timer.name} ends`;
            detail.querySelector('.detail-value').textContent = '—';
            schedule.querySelector('strong').textContent = `${timer.name}:`;
          }
        }
      }

      function renderPhaseTimes() {
        phases.forEach((phase, index) => {
          const endValue = $(`timerDetail${index + 1}`).querySelector('.detail-value');
          const scheduleValue = $(`scheduleDetail${index + 1}`).querySelector('time');
          endValue.textContent = formatClock(phase.end);
          scheduleValue.textContent = `${formatClock(phase.start)} – ${formatClock(phase.end)}`;
          endValue.dateTime = phase.end.toISOString();
          scheduleValue.dateTime = phase.start.toISOString();
        });
      }

      function setActiveTimer(activeIndex) {
        document.querySelectorAll('.timer-detail').forEach((detail, index) => {
          detail.classList.toggle('active', index === activeIndex);
        });
      }

      function showReadyTimer() {
        elements.remainingLabel.textContent = `${timers[0].name} remaining`;
        elements.remainingTime.textContent = formatCountdown(timers[0].durationMs);
        elements.statusText.textContent = 'Ready to begin';
      }

      function updateCountdown() {
        updateCurrentTime();
        if (!endAt) return;
        const now = Date.now();
        const phaseIndex = phases.findIndex((item) => now < item.end.getTime());
        const phase = phases[phaseIndex];
        if (!phase) {
          clearInterval(timerId);
          timerId = null;
          elements.remainingTime.textContent = formatCountdown(0);
          elements.statusText.textContent = 'Timer complete';
          setActiveTimer(-1);
          document.body.classList.remove('running', 'finishing');
          document.body.classList.add('finished');
          document.title = `Time is up — ${elements.timerName.textContent}`;
          releaseWakeLock();
          return;
        }
        setActiveTimer(phaseIndex);
        const remaining = phase.end.getTime() - now;
        elements.remainingLabel.textContent = `${phase.name} remaining`;
        elements.remainingTime.textContent = formatCountdown(remaining);
        elements.statusText.textContent = `${phase.name} underway`;
        document.body.classList.toggle('finishing', remaining <= 10 * 60 * 1000);
      }

      async function requestWakeLock() {
        try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (_) {}
      }
      async function releaseWakeLock() {
        try { if (wakeLock) await wakeLock.release(); } catch (_) {}
        wakeLock = null;
      }

      function startTimer() {
        let cursor = new Date();
        phases = timers.map((timer) => {
          const phase = { ...timer, start: cursor, end: new Date(cursor.getTime() + timer.durationMs) };
          cursor = phase.end;
          return phase;
        });
        endAt = phases.at(-1).end;
        renderPhaseTimes();
        elements.settingsButton.disabled = true;
        document.body.className = 'running';
        document.title = `${elements.timerName.textContent} — Timer`;
        updateCountdown();
        timerId = setInterval(updateCountdown, 250);
        requestWakeLock();
      }

      function applySecondsPreference(checked) {
        showSeconds = checked;
        elements.showSecondsMain.checked = checked;
        elements.showSecondsInput.checked = checked;
        updateCurrentTime();
        if (phases.length) {
          renderPhaseTimes();
          updateCountdown();
        } else {
          showReadyTimer();
        }
      }

      function resetTimer() {
        if (!confirm('Reset the timer and return to the ready screen?')) return;
        clearInterval(timerId);
        timerId = null;
        phases = [];
        endAt = null;
        document.body.className = '';
        setActiveTimer(-1);
        document.querySelectorAll('.timer-detail .detail-value, .staff-schedule time').forEach((value) => { value.textContent = '—'; });
        elements.settingsButton.disabled = false;
        document.title = 'Timer';
        showReadyTimer();
        releaseWakeLock();
      }

      function saveSettings(event) {
        event.preventDefault();
        const title = elements.nameInput.value.trim();
        if (!title) { elements.error.textContent = 'Enter a timer name.'; return; }
        const configured = [...elements.configList.querySelectorAll('.timer-config')].map((card) => {
          const name = card.querySelector('.phase-name').value.trim();
          const hours = Number(card.querySelector('.phase-hours').value || 0);
          const minutes = Number(card.querySelector('.phase-minutes').value || 0);
          return { name, hours, minutes };
        });
        if (configured.some((item) => !Number.isInteger(item.hours) || item.hours < 0 || item.hours > 24 || !Number.isInteger(item.minutes) || item.minutes < 0 || item.minutes > 59)) {
          elements.error.textContent = 'Use whole hours (0–24) and minutes (0–59).'; return;
        }
        if (configured.some((item) => (item.name && !item.hours && !item.minutes) || (!item.name && (item.hours || item.minutes)))) {
          elements.error.textContent = 'Give each timer both a name and duration, or leave all its fields blank.'; return;
        }
        const activeTimers = configured.filter((item) => item.name && (item.hours || item.minutes));
        if (!activeTimers.length) { elements.error.textContent = 'Configure at least one timer.'; return; }
        timers = activeTimers.map((item) => ({ name: item.name, durationMs: (item.hours * 60 + item.minutes) * 60000 }));
        applySecondsPreference(elements.showSecondsInput.checked);
        elements.timerName.textContent = title;
        elements.error.textContent = '';
        document.body.className = '';
        renderTimers();
        updateCurrentTime();
        showReadyTimer();
        elements.dialog.close();
      }

      function moveCard(card, direction) {
        const sibling = direction < 0 ? card.previousElementSibling : card.nextElementSibling;
        if (!sibling) return;
        if (direction < 0) elements.configList.insertBefore(card, sibling);
        else elements.configList.insertBefore(sibling, card);
      }

      elements.configList.addEventListener('dragstart', (event) => {
        draggedCard = event.target.closest('.timer-config');
        if (!draggedCard) return;
        draggedCard.classList.add('dragging');
        event.dataTransfer.effectAllowed = 'move';
      });
      elements.configList.addEventListener('dragover', (event) => {
        event.preventDefault();
        const target = event.target.closest('.timer-config');
        if (!draggedCard || !target || target === draggedCard) return;
        const rect = target.getBoundingClientRect();
        const before = window.innerWidth <= 800 ? event.clientY < rect.top + rect.height / 2 : event.clientX < rect.left + rect.width / 2;
        elements.configList.insertBefore(draggedCard, before ? target : target.nextSibling);
      });
      elements.configList.addEventListener('dragend', () => {
        if (draggedCard) draggedCard.classList.remove('dragging');
        draggedCard = null;
      });
      elements.configList.addEventListener('click', (event) => {
        const button = event.target.closest('[data-move]');
        if (button) moveCard(button.closest('.timer-config'), Number(button.dataset.move));
      });

      async function toggleFullscreen() {
        try {
          if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
          else await document.exitFullscreen();
        } catch (_) {}
      }

      elements.startButton.addEventListener('click', startTimer);
      elements.resetButton.addEventListener('click', resetTimer);
      elements.settingsButton.addEventListener('click', () => { elements.error.textContent = ''; elements.dialog.showModal(); });
      elements.cancelSettings.addEventListener('click', () => elements.dialog.close());
      elements.form.addEventListener('submit', saveSettings);
      elements.showSecondsMain.addEventListener('change', () => applySecondsPreference(elements.showSecondsMain.checked));
      elements.fullscreenButton.addEventListener('click', toggleFullscreen);
      document.addEventListener('fullscreenchange', () => {
        const active = Boolean(document.fullscreenElement);
        elements.fullscreenButton.innerHTML = `${active ? '✕' : '⛶'} <span class="button-text">${active ? 'Exit fullscreen' : 'Fullscreen'}</span>`;
        elements.fullscreenButton.setAttribute('aria-label', active ? 'Exit fullscreen' : 'Enter fullscreen');
      });
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && endAt) requestWakeLock(); });
      document.addEventListener('keydown', (event) => { if (event.key.toLowerCase() === 'f' && !elements.dialog.open) toggleFullscreen(); });

      renderTimers();
      showReadyTimer();
      updateCurrentTime();
      setInterval(updateCurrentTime, 1000);
    })();
  </script>
</body>
</html>
