<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A private, cloud-synced notepad.">
  <title>Notepad</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #080b10;
      --surface: #111722;
      --surface-hover: #172131;
      --text: #f5f7fb;
      --muted: #a8b3c3;
      --border: #293548;
      --accent: #63d8ff;
      --accent-dark: #062b38;
      --danger: #ff9b9b;
      --success: #8ce0b0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 5%, #14243c 0, transparent 30rem),
        var(--background);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      padding: clamp(32px, 6vw, 72px) 0;
    }

    a { color: var(--accent); }
    h1 { margin: 16px 0 8px; font-size: clamp(2.4rem, 7vw, 4.6rem); line-height: 1; }
    p { color: var(--muted); }

    .panel {
      margin-top: 28px;
      padding: clamp(20px, 4vw, 30px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
    }

    .auth-form { display: grid; gap: 14px; max-width: 440px; }
    label { display: grid; gap: 7px; font-weight: 700; }

    input, textarea, button { font: inherit; }

    input, textarea {
      width: 100%;
      color: var(--text);
      background: #0b1018;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    input { padding: 13px 14px; }

    input:focus, textarea:focus {
      outline: 3px solid rgba(99, 216, 255, 0.3);
      border-color: var(--accent);
    }

    textarea {
      display: block;
      min-height: min(62vh, 660px);
      padding: 20px;
      resize: vertical;
      line-height: 1.6;
    }

    button {
      min-height: 46px;
      padding: 10px 16px;
      color: var(--accent-dark);
      font-weight: 800;
      background: var(--accent);
      border: 0;
      border-radius: 11px;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.08); }
    button:disabled { cursor: wait; opacity: 0.65; }
    .secondary { color: var(--text); background: var(--surface-hover); border: 1px solid var(--border); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 14px; }
    .account { overflow-wrap: anywhere; color: var(--muted); font-size: 0.9rem; }
    .status { min-height: 1.5em; margin: 12px 0 0; }
    .status.error { color: var(--danger); }
    .status.success { color: var(--success); }
    .note-meta { display: flex; justify-content: space-between; gap: 12px; margin-top: 10px; color: var(--muted); font-size: 0.85rem; }
    [hidden] { display: none !important; }

    @media (max-width: 620px) {
      .toolbar, .note-meta { align-items: stretch; flex-direction: column; }
      .actions button { flex: 1; }
    }
  </style>
</head>
<body>
  <main>
    <a href="index.html">← Back to resources</a>
    <h1>Notepad</h1>
    <p>Your note is saved privately to the cloud and follows you between devices.</p>

    <section class="panel" id="auth-panel" aria-labelledby="sign-in-heading">
      <h2 id="sign-in-heading">Sign in</h2>
      <p>Use the same account on every computer.</p>
      <form class="auth-form" id="auth-form">
        <label>
          Email
          <input id="email" type="email" autocomplete="email" required>
        </label>
        <label>
          Password
          <input id="password" type="password" autocomplete="current-password" minlength="6" required>
        </label>
        <div class="actions">
          <button type="submit" id="sign-in-button">Sign in</button>
          <button type="button" class="secondary" id="sign-up-button">Create account</button>
        </div>
      </form>
      <p class="status" id="auth-status" role="status" aria-live="polite"></p>
    </section>

    <section class="panel" id="notepad-panel" aria-labelledby="note-heading" hidden>
      <div class="toolbar">
        <div>
          <h2 id="note-heading">My note</h2>
          <div class="account" id="account-label"></div>
        </div>
        <div class="actions">
          <button type="button" id="save-button">Save now</button>
          <button type="button" class="secondary" id="sign-out-button">Sign out</button>
        </div>
      </div>
      <textarea id="note" aria-label="Notepad content" placeholder="Start writing…" spellcheck="true"></textarea>
      <div class="note-meta">
        <span id="save-status" role="status" aria-live="polite">Ready</span>
        <span id="word-count">0 words</span>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://pwsysdrfakazvykqyddr.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_th45XdnwWlPJp2N2STVjsg_WIzLvQMQ";
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const authPanel = document.querySelector("#auth-panel");
    const notepadPanel = document.querySelector("#notepad-panel");
    const authForm = document.querySelector("#auth-form");
    const emailInput = document.querySelector("#email");
    const passwordInput = document.querySelector("#password");
    const signInButton = document.querySelector("#sign-in-button");
    const signUpButton = document.querySelector("#sign-up-button");
    const signOutButton = document.querySelector("#sign-out-button");
    const saveButton = document.querySelector("#save-button");
    const authStatus = document.querySelector("#auth-status");
    const saveStatus = document.querySelector("#save-status");
    const accountLabel = document.querySelector("#account-label");
    const note = document.querySelector("#note");
    const wordCount = document.querySelector("#word-count");

    let currentUser = null;
    let saveTimer = null;
    let lastSavedContent = "";
    let saveInProgress = false;
    let saveAgain = false;

    function setAuthStatus(message, type = "") {
      authStatus.textContent = message;
      authStatus.className = `status ${type}`.trim();
    }

    function setAuthBusy(isBusy) {
      signInButton.disabled = isBusy;
      signUpButton.disabled = isBusy;
    }

    function updateWordCount() {
      const count = note.value.trim() ? note.value.trim().split(/\s+/).length : 0;
      wordCount.textContent = `${count} ${count === 1 ? "word" : "words"}`;
    }

    async function showSession(session) {
      currentUser = session?.user ?? null;
      authPanel.hidden = Boolean(currentUser);
      notepadPanel.hidden = !currentUser;

      if (!currentUser) {
        note.value = "";
        lastSavedContent = "";
        return;
      }

      accountLabel.textContent = currentUser.email;
      saveStatus.textContent = "Loading your note…";
      const { data, error } = await client
        .from("notes")
        .select("content, updated_at")
        .eq("user_id", currentUser.id)
        .maybeSingle();

      if (error) {
        saveStatus.textContent = `Could not load your note: ${error.message}`;
        return;
      }

      note.value = data?.content ?? "";
      lastSavedContent = note.value;
      updateWordCount();
      saveStatus.textContent = data?.updated_at
        ? `Saved ${new Date(data.updated_at).toLocaleString()}`
        : "Ready — start writing";
      note.focus();
    }

    async function saveNote() {
      if (!currentUser || note.value === lastSavedContent) return;

      if (saveInProgress) {
        saveAgain = true;
        return;
      }

      saveInProgress = true;
      saveButton.disabled = true;
      saveStatus.textContent = "Saving…";
      const contentToSave = note.value;
      const updatedAt = new Date().toISOString();
      const { error } = await client.from("notes").upsert({
        user_id: currentUser.id,
        content: contentToSave,
        updated_at: updatedAt
      }, { onConflict: "user_id" });

      saveInProgress = false;
      saveButton.disabled = false;

      if (error) {
        saveStatus.textContent = `Save failed: ${error.message}`;
      } else {
        lastSavedContent = contentToSave;
        saveStatus.textContent = `Saved ${new Date(updatedAt).toLocaleTimeString()}`;
      }

      const shouldSaveAgain = saveAgain || (!error && note.value !== lastSavedContent);
      saveAgain = false;
      if (shouldSaveAgain) {
        await saveNote();
      }
    }

    authForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      setAuthBusy(true);
      setAuthStatus("Signing in…");
      const { error } = await client.auth.signInWithPassword({
        email: emailInput.value,
        password: passwordInput.value
      });
      setAuthBusy(false);
      setAuthStatus(error ? error.message : "", error ? "error" : "");
    });

    signUpButton.addEventListener("click", async () => {
      if (!authForm.reportValidity()) return;
      setAuthBusy(true);
      setAuthStatus("Creating your account…");
      const { data, error } = await client.auth.signUp({
        email: emailInput.value,
        password: passwordInput.value,
        options: {
          emailRedirectTo: new URL("notepad.html", window.location.href).href
        }
      });
      setAuthBusy(false);

      if (error) {
        setAuthStatus(error.message, "error");
      } else if (!data.session) {
        setAuthStatus("Account created. Check your email to confirm it, then sign in.", "success");
      } else {
        setAuthStatus("");
      }
    });

    note.addEventListener("input", () => {
      updateWordCount();
      saveStatus.textContent = "Unsaved changes";
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveNote, 700);
    });

    saveButton.addEventListener("click", () => {
      clearTimeout(saveTimer);
      saveNote();
    });

    signOutButton.addEventListener("click", async () => {
      clearTimeout(saveTimer);
      await saveNote();
      await client.auth.signOut();
    });

    client.auth.onAuthStateChange((event, session) => {
      if (event === "INITIAL_SESSION" || event === "SIGNED_IN" || event === "SIGNED_OUT") {
        showSession(session);
      }
    });
  </script>
</body>
</html>
